<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #1f1f1f;
    --surface: #252526;
    --accent: #007acc;
    --text: #cccccc;
    --muted: #9d9d9d;
    --border: #3c3c3c;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px;
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
  }
  h1 { font-size: 15px; margin: 0 0 12px; color: var(--accent); }
  label { display: block; margin: 8px 0 4px; color: var(--muted); }
  input, select {
    width: 100%;
    padding: 6px 8px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  button {
    margin-top: 12px;
    width: 100%;
    padding: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  #result { margin-top: 12px; padding: 10px; background: var(--surface); border-radius: 4px; display: none; }
  #result a { color: var(--accent); text-decoration: none; }
  #status { margin-top: 8px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <h1>Random CF Problem</h1>
  <label>Tags (comma separated)</label>
  <input id="tags" placeholder="dp, graphs" />
  <label>Min rating</label>
  <input id="minRating" type="number" placeholder="800" />
  <label>Max rating</label>
  <input id="maxRating" type="number" placeholder="1600" />
  <button id="pick">Pick Random Problem</button>
  <div id="result"></div>
  <div id="status"></div>
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
